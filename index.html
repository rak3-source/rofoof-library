<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rofoof | Al-Arabiya Private School Digital Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>

    <header class="official-header">
        <div class="container header-content">
            <div class="school-brand">
                <div class="logo-royal-frame">
                    <img src="logo.png" alt="Al-Arabiya Private School Logo" class="school-logo">
                </div>
                <div>
                    <h1>Rofoof Digital Library</h1>
                    <p>Al-Arabiya Private School — Official Reading Portal</p>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search books by title or author...">
            </div>
        </div>
    </header>

    <nav class="categories-bar">
        <div class="container categories-list" id="categoriesList">
            <button class="cat-btn active" data-category="all">All Books</button>
            <button class="cat-btn" data-category="Science Fiction">Science Fiction</button>
            <button class="cat-btn" data-category="Short Stories">Short Stories</button>
            <button class="cat-btn" data-category="Novels">Novels</button>
            <button class="cat-btn" data-category="Science">Science</button>
            <button class="cat-btn" data-category="History">History</button>
        </div>
    </nav>

    <main class="container main-section">
        <div class="section-header">
            <h2>Featured Library Collection</h2>
            <span class="book-count" id="bookCount">1 Book Available</span>
        </div>
        <div class="books-grid" id="booksGrid"></div>
    </main>

    <!-- نافذة القارئ الاحترافي المتكامل -->
    <div class="reader-modal" id="readerModal">
        <div class="reader-container" id="readerContainer">
            <!-- شريط أدوات القراءة العلوي -->
            <div class="reader-header">
                <div class="reader-title-group">
                    <span class="badge-live">📖 Rofoof Reader</span>
                    <h3 id="modalBookTitle">Book Title</h3>
                </div>

                <!-- أدوات القراءة الذكية -->
                <div class="reader-toolbar">
                    <button class="tool-btn" id="bookmarkBtn" title="Save Reading Position">
                        🔖 <span id="bookmarkText">Save Bookmark</span>
                    </button>
                    <button class="tool-btn" id="goBookmarkBtn" style="display: none;" title="Jump to Saved Page">
                        📌 Go to Saved (<span id="savedPageNum">1</span>)
                    </button>
                    <button class="tool-btn" id="sepiaBtn" title="Eye-Comfort Paper Mode">
                        🌙 Warm Paper
                    </button>
                    <button class="tool-btn" id="zoomOutBtn" title="Zoom Out">➖</button>
                    <button class="tool-btn" id="zoomInBtn" title="Zoom In">➕</button>
                    <button class="tool-btn" id="fullscreenBtn" title="Full Screen Mode">
                        ⛶ Full Screen
                    </button>
                    <button class="close-btn" id="closeModalBtn">✕</button>
                </div>
            </div>

            <!-- شريط التقدم الذهبي -->
            <div class="reading-progress-track">
                <div class="reading-progress-fill" id="readingProgressFill"></div>
            </div>

            <!-- منصة الكتاب مع الكعب الذهبي الفاصل -->
            <div class="reader-body flipbook-stage" id="flipbookStage">
                <div id="loadingSpinner" class="loading-text">Opening Book Pages...</div>
                
                <!-- الشريط الذهبي المرجعي (Bookmark Ribbon) -->
                <div class="gold-bookmark-ribbon" id="goldBookmarkRibbon" style="display: none;">
                    <span>🔖 Saved</span>
                </div>

                <div class="book-wrapper" id="bookWrapper">
                    <div id="flipbookContainer"></div>
                    <!-- الفاصل الذهبي الملكي بين الصفحتين -->
                    <div class="golden-book-spine" id="goldenSpine"></div>
                </div>
            </div>

            <!-- شريط التنقل السفلي -->
            <div class="reader-footer-bar">
                <button class="nav-page-btn" id="prevPageBtn">◀ Previous Page</button>
                <div class="page-jump-box">
                    <span id="pageIndicator">Page 1 of 1</span>
                    <span class="progress-percent" id="progressPercent">(0%)</span>
                </div>
                <button class="nav-page-btn" id="nextPageBtn">Next Page ▶</button>
            </div>
        </div>
    </div>

    <footer class="official-footer">
        <div class="container">
            <p>© 2026 All Rights Reserved - Al-Arabiya Private School | Managed by Student HASHEM</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
